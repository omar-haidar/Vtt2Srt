name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # مطلوب لإنشاء الـ release ورفع الملفات

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Prepare APK
      if: github.event_name == 'push'
      run: cp app/build/outputs/apk/debug/app-debug.apk Vtt2Srt.apk

    - name: Publish to the single "latest" release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --cleanup-tag --yes || true
        gh release create latest Vtt2Srt.apk \
          --title "Latest build" \
          --notes "Automated build from commit ${GITHUB_SHA::7}" \
          --target "$GITHUB_SHA" \
          --latest
